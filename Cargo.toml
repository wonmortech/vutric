[workspace]
resolver = "3"
members = [
    "crates/vutric-core",
    "crates/vutric-overlay",
    "crates/vutric-host-win",
    "crates/vutric-net",
    "crates/vutric-relay",
    "crates/vutric-compat-localsend",
    "crates/vutric-compat-quickshare",
    "crates/vutric-compat-kdeconnect",
    "apps/net-spike",
    "crates/vutric-mobile",
    "apps/overlay-spike",
    "crates/vutric-compat-wormhole",
    "crates/vutric-host-mac",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/wonmortech/vutric"
authors = ["Vutric contributors"]

[workspace.dependencies]
vutric-core = { path = "crates/vutric-core" }
vutric-overlay = { path = "crates/vutric-overlay" }
vutric-host-win = { path = "crates/vutric-host-win" }

anyhow = "1.0.104"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
pollster = "0.4"
postcard = { version = "1.1.3", features = ["use-std"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wgpu = "30.0.2"
winit = "0.30.13"
arbitrary = { version = "1.5.0", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Exact comparisons of easing endpoints (0.0, 1.0) are intended in tests.
float_cmp = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# libc >= 0.2.190 exposes some Darwin networking items on macOS only, which breaks iOS builds of iroh's network
# stack. Vendored copies carry the upstream fixes until they are released (see third_party/README.md).
[patch.crates-io]
netdev = { path = "third_party/netdev" }
netwatch = { path = "third_party/netwatch" }
