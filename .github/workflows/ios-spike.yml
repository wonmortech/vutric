# Builds the Phase 0.2 spike for iPhone. Nothing is published to the App Store or TestFlight: testers sign the .ipa
# with their own Apple ID while sideloading (Sideloadly, AltStore, or Xcode). Two files come out (ADR-0015):
#   vutric-spike-unsigned.ipa   no signature at all, as before;
#   vutric-spike-adhoc.ipa      ad-hoc signed with the App Group and hotspot entitlements written in, so a sideloading
#                               tool that copies entitlements from the bundle keeps the Share Extension, the widget
#                               and App Intents working.
# On the way it runs the VutricKit XCTests on a simulator, checks that Rust's share API made it into the Share
# Extension, and writes the binary sizes into the job summary.

name: iOS spike

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/mobile-spike/**
      - crates/vutric-core/**
      - crates/vutric-net/**
      - crates/vutric-mobile/**
      - Cargo.lock
      - .github/workflows/ios-spike.yml

permissions:
  contents: read

concurrency:
  group: ios-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Intel host: arm64 macOS runners kept timing out in the queue; the iPhone target is cross-compiled anyway.
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The static library (linked into Runner and the Share Extension) and its UniFFI Swift bindings (ADR-0015).
      - name: Rust library for iPhone (arm64) and Swift bindings
        run: apps/mobile-spike/tool/ios_bindings.sh

      - name: VutricKit tests (iOS simulator)
        working-directory: apps/mobile-spike/ios/VutricKit
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if ".iOS-" in k), reverse=True)
          print(next(x["udid"] for k in ios for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator: $udid"
          set -o pipefail
          xcodebuild test -scheme VutricKit -destination "id=$udid" -quiet 2>&1 | grep -vE "IDETestOperationsObserverDebug" | tail -n 200

      # Straight from the Flutter repo: the org allows only GitHub-owned and verified actions.
      - name: Flutter 3.50.0
        run: |
          git clone --quiet --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - name: App and extensions (release, no code signing)
        working-directory: apps/mobile-spike
        run: |
          flutter pub get
          flutter build ios --release --no-codesign
          app=build/ios/iphoneos/Runner.app
          for x in VutricShare VutricWidgets; do
            test -x "$app/PlugIns/$x.appex/$x" || { echo "::error::$x.appex is missing from Runner.app"; exit 1; }
          done
          # The Rust bridge is looked up by name at run time; make sure the linker kept it.
          n=$(nm -gU "$app/Runner" | grep -c frb_get_rust_content_hash || true)
          echo "Rust bridge symbols in Runner: $n"
          test "$n" -gt 0
          # The Share Extension and App Intents call Rust through UniFFI; dead stripping must keep the share API.
          for b in "$app/Runner" "$app/PlugIns/VutricShare.appex/VutricShare"; do
            n=$(nm -gU "$b" | grep -c uniffi_vutric_mobile_fn_func_share_send || true)
            echo "UniFFI share_send in $(basename "$b"): $n"
            test "$n" -gt 0
          done

      - name: Sizes
        working-directory: apps/mobile-spike/build/ios/iphoneos/Runner.app
        run: |
          size() { stat -f%z "$1"; }
          mb() { echo "scale=1; $1 / 1048576" | bc; }
          share=$(size PlugIns/VutricShare.appex/VutricShare)
          {
            echo "### iOS binary sizes (arm64, release, before App Store thinning)"
            echo "| Binary | Bytes | MB |"
            echo "|---|---:|---:|"
            for f in Runner Frameworks/App.framework/App PlugIns/VutricShare.appex/VutricShare PlugIns/VutricWidgets.appex/VutricWidgets; do
              echo "| \`$f\` | $(size "$f") | $(mb "$(size "$f")") |"
            done
            echo "| \`VutricShare.appex\` (whole bundle) | $(du -sk PlugIns/VutricShare.appex | cut -f1) KiB | |"
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          # A Share Extension gets about 120 MB of memory; a binary near that would not even load.
          test "$share" -lt 104857600 || { echo "::error::VutricShare is over 100 MB"; exit 1; }

      - name: IPAs (unsigned, and ad-hoc with entitlements)
        working-directory: apps/mobile-spike
        run: |
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry vutric-spike-unsigned.ipa Payload
          # Ad hoc: the same bundle with the entitlements in each signature ($(VUTRIC_APP_GROUP) expanded).
          group=$(grep -m1 -o 'VUTRIC_APP_GROUP = [^;]*' ios/Runner.xcodeproj/project.pbxproj | cut -d' ' -f3)
          mkdir -p "$RUNNER_TEMP/ent"
          for t in Runner VutricShare VutricWidgets; do
            sed "s/\$(VUTRIC_APP_GROUP)/$group/" "ios/$t/$t.entitlements" > "$RUNNER_TEMP/ent/$t.plist"
            plutil -lint "$RUNNER_TEMP/ent/$t.plist"
          done
          app=Payload/Runner.app
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \;
          for x in VutricShare VutricWidgets; do
            codesign -f -s - --entitlements "$RUNNER_TEMP/ent/$x.plist" "$app/PlugIns/$x.appex"
          done
          codesign -f -s - --entitlements "$RUNNER_TEMP/ent/Runner.plist" "$app"
          codesign --verify --deep --strict "$app"
          for b in "$app" "$app/PlugIns/VutricShare.appex" "$app/PlugIns/VutricWidgets.appex"; do
            codesign -d --entitlements - "$b" 2>/dev/null | grep -q "$group" || { echo "::error::$b lacks $group"; exit 1; }
          done
          zip -qry vutric-spike-adhoc.ipa Payload
          ls -la vutric-spike-unsigned.ipa vutric-spike-adhoc.ipa

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vutric-spike-ios
          path: |
            apps/mobile-spike/vutric-spike-unsigned.ipa
            apps/mobile-spike/vutric-spike-adhoc.ipa
          retention-days: 14
          if-no-files-found: error
