#
# W4 · Linux desktop (ADR-0090..0092): the Linux crates, the overlay on headless sway (layer-shell) and headless
# GNOME Shell (extension), the extension's lint and tests, and the .deb.

name: Linux desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/vutric-host-wlr/**"
      - "crates/vutric-host-linux/**"
      - "crates/vutric-overlay/**"
      - "crates/vutric-core/**"
      - "crates/vutric-compat-*/**"
      - "apps/gnome-extension/**"
      - "packaging/linux/**"
      - ".github/workflows/linux-*.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  crates:
    name: crates (clippy, tests, D-Bus)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-w4-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-w4-
      - name: Format
        run: cargo fmt -p vutric-host-wlr -p vutric-host-linux --check
      - name: Clippy
        run: cargo clippy -p vutric-host-wlr -p vutric-host-linux --all-targets --locked -- -D warnings
      - name: Unit tests
        run: cargo test -p vutric-host-wlr -p vutric-host-linux --locked
      - name: D-Bus tests (tray, notifications) on a private session bus
        run: dbus-run-session -- cargo test -p vutric-host-linux --test dbus --locked -- --nocapture

  extension:
    name: GNOME extension (eslint, node tests, zip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Unit tests (pure helpers, D-Bus contract)
        run: node --test apps/gnome-extension/tests/lib.test.mjs
      - name: ESLint
        working-directory: apps/gnome-extension
        run: npx --yes eslint@9.39.1 .
      - name: Pack for extensions.gnome.org
        run: |
          cd "apps/gnome-extension/vutric@wonmor.io"
          zip -r -X "$GITHUB_WORKSPACE/vutric@wonmor.io.shell-extension.zip" . -x '*.md'
          unzip -l "$GITHUB_WORKSPACE/vutric@wonmor.io.shell-extension.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gnome-extension
          path: vutric@wonmor.io.shell-extension.zip

  deb:
    name: .deb (dpkg-deb, lintian)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-w4-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-w4-release-
      - name: Build
        run: |
          cargo build --release --locked -p vutric-host-linux --bin vutric-surface
          cargo build --release --locked -p vutric-compat-localsend --bin vutric-compat
      - name: Package
        run: bash packaging/linux/build-deb.sh target/deb
      - name: lintian (report only)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends lintian
          lintian --info --display-info target/deb/*.deb | tee target/deb/lintian.txt || true
      - name: Install and remove on the runner
        run: |
          sudo apt-get install -y ./target/deb/*.deb
          test -x /usr/libexec/vutric/vutric-surface
          test -x /usr/libexec/vutric/vutric-compat
          test -f /usr/share/gnome-shell/extensions/vutric@wonmor.io/metadata.json
          test -f /usr/lib/firewalld/services/vutric.xml
          systemd-analyze --user verify /usr/lib/systemd/user/vutric.service || true
          desktop-file-validate /usr/share/applications/io.wonmor.Vutric.desktop || true
          sudo apt-get remove -y vutric
      - uses: actions/upload-artifact@v4
        with:
          name: vutric-deb
          path: target/deb/

  compat:
    name: LocalSend / Quick Share on Linux (with Avahi running)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-w4-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-w4-
      # Every Ubuntu and Fedora desktop runs avahi-daemon on UDP 5353; the Quick Share advert (mdns-sd) and the
      # LocalSend multicast must work next to it (ADR-0093 §4).
      - name: avahi-daemon
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends avahi-daemon avahi-utils
          sudo systemctl start avahi-daemon
          systemctl is-active avahi-daemon
      - name: Engine tests on Linux, next to Avahi
        run: cargo test --locked -p vutric-compat-quickshare -p vutric-compat-localsend
      - name: Quick Share advert seen by Avahi
        run: |
          cargo build --locked -p vutric-compat-localsend --bin vutric-compat
          bash packaging/linux/ci/compat-avahi.sh target/debug/vutric-compat compat-avahi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-compat-avahi
          path: compat-avahi/

  slint-m1:
    name: Slint windows on Linux (W2 M1 spike, headless sway)
    runs-on: ubuntu-24.04
    # TEMP: builds W2's spike from its branch until the windows binary is in the workspace (w4-notes §3).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          ref: w2/desktop
          path: w2
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: sway, Mesa, Slint build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sway mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Build the Slint spike
        working-directory: w2/apps/desktop/m1-spike/slint
        run: cargo build --release --locked
      - name: Run it under headless sway
        run: bash packaging/linux/ci/slint-sway.sh w2/apps/desktop/m1-spike/slint/target/release/vutric-m1-slint slint-m1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-slint-m1
          path: slint-m1/

  overlay-sway:
    name: overlay on headless sway (layer-shell)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-w4-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-w4-release-
      - name: sway, Mesa lavapipe (software Vulkan)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends sway mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Build
        run: cargo build --release --locked -p vutric-host-linux --bin vutric-surface --example surface_driver
      - name: Run the overlay and record frames
        run: bash packaging/linux/ci/sway-headless.sh linux-overlay-sway
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-overlay-sway
          path: linux-overlay-sway/

  overlay-gnome:
    name: overlay on headless GNOME Shell (extension)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            target
          key: linux-w4-release-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: linux-w4-release-
      - name: GNOME Shell, Mesa
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends gnome-shell gnome-shell-extension-prefs \
            dbus-daemon dconf-service mesa-vulkan-drivers libvulkan1 libegl-mesa0 libgl1-mesa-dri
      - name: Build
        run: cargo build --release --locked -p vutric-host-linux --bin vutric-surface --example surface_driver
      - name: Run the extension and the surface
        run: dbus-run-session -- bash packaging/linux/ci/gnome-headless.sh linux-overlay-gnome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-overlay-gnome
          path: linux-overlay-gnome/
