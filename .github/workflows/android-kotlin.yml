# The phone app's Kotlin modules (streams W1 and W6): JVM unit tests, Robolectric included. No Rust and no device:
# the Gradle project is generated by `flutter build apk --config-only`, then only the unit-test task runs.

name: Android Kotlin

on:
  pull_request:
    paths:
      - apps/mobile-spike/android/**
      - .github/workflows/android-kotlin.yml
  push:
    branches: [main]
    paths:
      - apps/mobile-spike/android/**

permissions:
  contents: read

concurrency:
  group: android-kotlin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile-spike
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Straight from the Flutter repo: the org allows only GitHub-owned and verified actions.
      - name: Flutter 3.50.0
        run: |
          git clone --quiet --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/flutter/bin/flutter" --disable-analytics

      - name: Gradle project
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --config-only

      - name: Unit tests
        working-directory: apps/mobile-spike/android
        run: ./gradlew :app:testDebugUnitTest --console=plain
