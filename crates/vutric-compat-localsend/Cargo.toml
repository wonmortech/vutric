[package]
name = "vutric-compat-localsend"
description = "LocalSend v2.2 adapter: send to and receive from the LocalSend app, in its own low-privilege process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vutric-core.workspace = true
vutric-compat-quickshare = { path = "../vutric-compat-quickshare" }
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
bytes = "1.12.1"
http = "1.5.0"
http-body-util = { version = "0.1.5", features = ["channel"] }
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "io-std", "sync", "time", "process"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[[bin]]
# One low-privilege process for every foreign protocol: LocalSend, the browser page, Quick Share (ADR-0056).
name = "vutric-compat"
path = "src/main.rs"

[lints]
workspace = true
