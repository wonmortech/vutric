<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Vutric</title>
<style nonce="{NONCE}">
:root{--bg:#f6f4ef;--card:#fff;--ink:#16181d;--mute:#646a75;--line:#e3e0d8;--accent:#2348d6;--ok:#167a48;--bad:#b42318;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101217;--card:#181b22;--ink:#eceef2;--mute:#9aa1ad;--line:#2a2f3a;--accent:#7d97ff;--ok:#4cc38a;--bad:#ff8a7a;--on-accent:#0b1020}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{flex:1;min-width:0;overflow-wrap:anywhere}
.size{color:var(--mute);font-size:13px;white-space:nowrap}
a.btn,button,label.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:600;text-decoration:none;cursor:pointer}
a.btn.small{min-height:36px;padding:0 12px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--mute);margin-bottom:12px}
.drop.over{border-color:var(--accent);color:var(--ink)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.status{margin-top:12px;font-size:14px;min-height:21px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
progress{width:100%;height:8px;margin-top:8px}
.empty{color:var(--mute);font-size:14px}
</style>
</head>
<body>
<main>
  <h1 id="title">Vutric</h1>
  <p class="sub" id="sub"></p>
  <section id="down" hidden>
    <h2 id="downH"></h2>
    <ul id="files"></ul>
  </section>
  <section id="up">
    <h2 id="upH"></h2>
    <label class="drop" id="drop" for="pick"><span id="dropT"></span></label>
    <input type="file" id="pick" multiple>
    <ul id="chosen"></ul>
    <button id="send" disabled></button>
    <progress id="bar" max="1" value="0" hidden></progress>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
</main>
<script nonce="{NONCE}">
"use strict";
const S = {
  en: {sub:"Files shared from {a}. The link stops working in {m} min.", gone:"This link has expired. Ask for a new one.",
       downH:"Download", upH:"Send to {a}", drop:"Choose files or drop them here", send:"Send",
       wait:"Waiting for {a} to accept…", sending:"Sending {i} of {n}…", done:"Sent.", rejected:"{a} declined.",
       busy:"{a} is receiving something else. Try again shortly.", many:"Too many tries. Wait a minute.",
       fail:"Sending failed.", none:"Nothing shared to download.", dl:"Download"},
  uz: {sub:"{a} ulashgan fayllar. Havola {m} daqiqadan keyin yopiladi.", gone:"Havola muddati tugagan. Yangisini so‘rang.",
       downH:"Yuklab olish", upH:"{a} ga yuborish", drop:"Fayllarni tanlang yoki shu yerga tashlang", send:"Yuborish",
       wait:"{a} qabul qilishini kutyapmiz…", sending:"{n} tadan {i}-si yuborilmoqda…", done:"Yuborildi.",
       rejected:"{a} rad etdi.", busy:"{a} hozir boshqa narsani qabul qilyapti. Birozdan keyin urinib ko‘ring.",
       many:"Urinishlar ko‘p. Bir daqiqa kuting.", fail:"Yuborib bo‘lmadi.", none:"Yuklab olish uchun fayl yo‘q.", dl:"Yuklab olish"}
};
const lang = (navigator.language || "en").toLowerCase().startsWith("uz") ? "uz" : "en";
document.documentElement.lang = lang;
let alias = "Vutric";
const t = (k, v = {}) => S[lang][k].replace(/\{(\w)\}/g, (_, x) => x === "a" ? alias : String(v[x] ?? ""));
const $ = id => document.getElementById(id);
const token = location.pathname.split("/")[2];
const size = n => n < 1024 ? n + " B" : n < 1048576 ? (n / 1024).toFixed(0) + " KB"
  : n < 1073741824 ? (n / 1048576).toFixed(1) + " MB" : (n / 1073741824).toFixed(2) + " GB";
function say(k, cls = "", v) { const s = $("status"); s.textContent = k ? t(k, v) : ""; s.className = "status " + cls; }
function row(name, bytes, link) {
  const li = document.createElement("li");
  const n = document.createElement("span"); n.className = "name"; n.textContent = name;
  const z = document.createElement("span"); z.className = "size"; z.textContent = size(bytes);
  li.append(n, z);
  if (link) { const a = document.createElement("a"); a.className = "btn small"; a.href = link; a.download = name; a.textContent = t("dl"); li.append(a); }
  return li;
}
function labels() {
  document.title = alias + " · Vutric";
  $("title").textContent = alias;
  $("downH").textContent = t("downH"); $("upH").textContent = t("upH");
  $("dropT").textContent = t("drop"); $("send").textContent = t("send");
}
async function load() {
  labels();
  let r;
  try { r = await fetch("/s/" + token + "/list", {cache: "no-store"}); } catch (e) { r = null; }
  if (!r || !r.ok) { $("sub").textContent = t("gone"); $("up").hidden = true; return; }
  const j = await r.json();
  alias = j.alias || alias; labels();
  $("sub").textContent = t("sub", {m: Math.max(1, Math.round(j.expires_in / 60))});
  const ul = $("files"); ul.replaceChildren();
  j.files.forEach((f, i) => ul.append(row(f.name, f.size, "/s/" + token + "/f/" + i)));
  $("down").hidden = j.files.length === 0;
}
let picked = [];
function choose(list) {
  picked = Array.from(list).slice(0, 1000);
  const ul = $("chosen"); ul.replaceChildren();
  picked.forEach(f => ul.append(row(f.name, f.size)));
  $("send").disabled = picked.length === 0; say("");
}
$("pick").addEventListener("change", e => choose(e.target.files));
const drop = $("drop");
["dragenter", "dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => choose(e.dataTransfer.files));
function hex(n) { const b = new Uint8Array(n); crypto.getRandomValues(b); return Array.from(b, x => x.toString(16).padStart(2, "0")).join(""); }
function browserName() { const u = navigator.userAgent; return /Edg\//.test(u) ? "Edge" : /Firefox\//.test(u) ? "Firefox" : /Chrome\//.test(u) ? "Chrome" : /Safari\//.test(u) ? "Safari" : "Browser"; }
function put(url, file, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open("POST", url);
    x.upload.onprogress = e => e.lengthComputable && onProgress(e.loaded);
    x.onload = () => resolve(x.status);
    x.onerror = x.onabort = () => resolve(0);
    x.send(file);
  });
}
$("send").addEventListener("click", async () => {
  if (!picked.length) return;
  $("send").disabled = true;
  const files = {};
  picked.forEach((f, i) => { files["f" + i] = {id: "f" + i, fileName: f.name || "file", size: f.size, fileType: f.type || "application/octet-stream"}; });
  const info = {alias: browserName() + " (web)", version: "2.2", deviceModel: browserName(), deviceType: "web", fingerprint: hex(32), download: false};
  say("wait");
  let r;
  try {
    r = await fetch("/api/localsend/v2/prepare-upload", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({info, files})});
  } catch (e) { r = null; }
  if (!r || r.status !== 200) {
    const code = r ? r.status : 0;
    say(code === 403 ? "rejected" : code === 409 ? "busy" : code === 429 ? "many" : "fail", "bad");
    $("send").disabled = false; return;
  }
  const ans = await r.json();
  const ids = Object.keys(ans.files);
  const total = ids.reduce((s, id) => s + files[id].size, 0) || 1;
  const bar = $("bar"); bar.hidden = false; bar.value = 0;
  let base = 0;
  for (let i = 0; i < ids.length; i++) {
    const id = ids[i];
    say("sending", "", {i: i + 1, n: ids.length});
    const q = "sessionId=" + encodeURIComponent(ans.sessionId) + "&fileId=" + encodeURIComponent(id) + "&token=" + encodeURIComponent(ans.files[id]);
    const code = await put("/api/localsend/v2/upload?" + q, picked[Number(id.slice(1))], n => { bar.value = (base + n) / total; });
    if (code !== 200) { say("fail", "bad"); $("send").disabled = false; return; }
    base += files[id].size; bar.value = base / total;
  }
  choose([]); say("done", "ok");
});
load();
</script>
</body>
</html>
