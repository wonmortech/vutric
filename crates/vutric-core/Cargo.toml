[package]
name = "vutric-core"
description = "Vutric wire protocol, pairing payload and framing. No I/O, no GPU."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
blake3.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
# R8 cloud handoff (ADR-0072): already in the tree through iroh/rustls; RustCrypto, MIT OR Apache-2.0.
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
hmac = "0.12.1"
sha2 = { version = "0.10.9", default-features = false }
arbitrary = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[features]
# Structure-aware fuzzing (`fuzz/`): derives `arbitrary::Arbitrary` for every wire type.
arbitrary = ["dep:arbitrary"]

[lints]
workspace = true
