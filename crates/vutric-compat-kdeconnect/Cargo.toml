[package]
name = "vutric-compat-kdeconnect"
description = "KDE Connect v8 adapter, share plugin only: send to and receive from KDE Connect and GSConnect, clean-room."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vutric-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11.1"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["net", "io-util", "fs", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }

[lints]
workspace = true
