[package]
name = "vutric-host-linux"
description = "Vutric on the Linux desktop: the surface process, the StatusNotifierItem tray, notifications, the GNOME extension client and the session files."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "vutric-surface"
path = "src/bin/vutric-surface/main.rs"

[dependencies]
postcard.workspace = true
serde.workspace = true
vutric-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
futures-util = { version = "0.3.31", default-features = false }
pollster.workspace = true
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "net", "io-util", "process"] }
vutric-host-wlr = { path = "../vutric-host-wlr" }
vutric-overlay.workspace = true
wgpu.workspace = true
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[lints]
workspace = true
