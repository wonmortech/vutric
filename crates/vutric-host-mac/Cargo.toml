[package]
name = "vutric-host-mac"
description = "macOS host pieces: the non-activating, click-through NSPanel overlay with display-link pacing, its probe, and the foreground LocalSend / Quick Share bridge for the menu-bar agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "sync"] }
vutric-compat-localsend = { path = "../vutric-compat-localsend" }
vutric-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "objc2-quartz-core",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "libc",
    "NSPanel",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindowLevel"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSGeometry",
    "NSObject",
    "NSProcessInfo",
    "NSString",
    "NSArray",
    "NSRunLoop",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "CADisplayLink",
    "CAFrameRateRange",
] }
pollster.workspace = true
raw-window-handle.workspace = true
vutric-overlay.workspace = true
wgpu.workspace = true
winit.workspace = true

[[bin]]
name = "vutric-mac-probe"
path = "src/bin/probe/main.rs"

[[bin]]
name = "vutric-mac-compat"
path = "src/bin/mac-compat/main.rs"

[lints]
workspace = true
