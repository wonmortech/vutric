[package]
name = "vutric-net"
description = "Vutric transport: iroh endpoint, mDNS discovery, pairing, control stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vutric-core.workspace = true
anyhow.workspace = true
blake3.workspace = true
image.workspace = true
iroh = { version = "1.4.1", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "sync", "net"] }
n0-future = "0.3.2"
serde_json = "1"
netdev = "0.46.3"
socket2 = "0.6.5"
# R8 cloud handoff (ADR-0072): the same reqwest/rustls iroh already builds, no new crates.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-platform-verifier = "0.7.1"
btleplug = { version = "0.13.5", optional = true }
uuid = { version = "1", optional = true }

[features]
# Desktop BLE central for R4 (ADR-0071). Off by default: on Linux it needs libdbus-1-dev to build.
ble = ["dep:btleplug", "dep:uuid"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[lints]
workspace = true
