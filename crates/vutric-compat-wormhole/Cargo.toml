[package]
name = "vutric-compat-wormhole"
description = "magic-wormhole adapter (mailbox, SPAKE2, transit, file transfer): send to and receive from `wormhole`, clean-room."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
vutric-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json = "1"
crypto_secretbox = "0.1.1"
hkdf = "0.12.4"
ring = "0.17.14"
sha2-10 = { package = "sha2", version = "0.10.9" }
spake2 = "0.4.0"
tokio = { version = "1.54.1", features = ["net", "io-util", "fs", "sync", "time", "rt", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "process"] }

[lints]
workspace = true
