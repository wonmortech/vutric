[package]
name = "vutric-m1-slint"
description = "M1 desktop UI spike: the settings screen and the Halqa preview in Slint."
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
publish = false

# A spike, kept out of the main workspace so its dependency tree never reaches Cargo.lock or CI.
[workspace]

[dependencies]
slint = { version = "1.19.0", features = ["unstable-winit-030"] }

[build-dependencies]
slint-build = "1.19.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
