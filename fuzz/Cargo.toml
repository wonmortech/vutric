[package]
name = "vutric-fuzz"
description = "Protocol-aware fuzz targets for every parser that sees peer or file input (backlog S4)."
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: libFuzzer needs nightly and sanitizer flags, which must never leak into the main build.
[workspace]
members = ["."]

[features]
default = ["libfuzzer"]
# Off for the stable smoke run (`cargo test --no-default-features`), which needs no C++ toolchain.
libfuzzer = ["dep:libfuzzer-sys"]

[dependencies]
vutric-core = { path = "../crates/vutric-core", features = ["arbitrary"] }
arbitrary = { version = "1.5.0", features = ["derive"] }
libfuzzer-sys = { version = "0.4.13", optional = true }
serde_json = "1"
vutric-compat-localsend = { path = "../crates/vutric-compat-localsend" }
vutric-compat-quickshare = { path = "../crates/vutric-compat-quickshare" }
vutric-compat-kdeconnect = { path = "../crates/vutric-compat-kdeconnect" }

[[bin]]
name = "frame_stream"
path = "fuzz_targets/frame_stream.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

